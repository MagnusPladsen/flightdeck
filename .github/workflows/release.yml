name: release

# Releases the version in VERSION once: a push to main whose version already has a tag publishes
# nothing. Bump VERSION on main to ship a new release. The zip goes to GitHub Releases, its Sparkle
# appcast to the fixed update-feed release the app reads, and, when TAP_TOKEN is set, the cask in
# MagnusPladsen/homebrew-tap is updated to point at it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its tag
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: swift test

      - name: Build the universal app
        if: steps.version.outputs.release == 'true'
        env:
          SWIFT_BUILD_FLAGS: --arch arm64 --arch x86_64
        run: |
          scripts/bundle.sh
          mkdir release
          ditto -c -k --keepParent Flightdeck.app release/Flightdeck.zip
          codesign --verify --strict Flightdeck.app

      # Needs SPARKLE_PRIVATE_KEY: the EdDSA private key whose public half is SUPublicEDKey in scripts/bundle.sh
      - name: Generate the appcast
        if: steps.version.outputs.release == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set, so the update can't be signed"
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            release

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" release/Flightdeck.zip release/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            ${prerelease:+"$prerelease"}
          # The app reads its feed from this fixed release, because releases/latest skips pre-releases
          gh release view update-feed > /dev/null 2>&1 || gh release create update-feed \
            --target "$GITHUB_SHA" \
            --title "Update feed" --notes "Sparkle feed read by Flightdeck. Not a release; download builds from the releases above." \
            --prerelease --latest=false
          gh release upload update-feed release/appcast.xml --clobber

      - name: Update the Homebrew cask
        if: steps.version.outputs.release == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN is not set, leaving the Homebrew cask alone"
            exit 0
          fi
          sha=$(shasum -a 256 release/Flightdeck.zip | cut -d' ' -f1)
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/MagnusPladsen/homebrew-tap.git" tap
          if [ ! -f tap/Casks/flightdeck.rb ]; then
            cp packaging/homebrew/flightdeck.rb tap/Casks/flightdeck.rb
          fi
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" tap/Casks/flightdeck.rb
          git -C tap add Casks/flightdeck.rb
          if git -C tap diff --cached --quiet; then
            echo "The cask already offers $VERSION"
            exit 0
          fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit -q -m "Update flightdeck to $VERSION"
          git -C tap push -q
